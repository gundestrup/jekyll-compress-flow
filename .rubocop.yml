AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  Exclude:
    - "_site/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"
    - "spec/fixtures/**/*"

plugins:
  - rubocop-rspec

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Enabled: true

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
    - "Rakefile"

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 20

RSpec/ExampleLength:
  Exclude:
    - "spec/**/*"

RSpec/MultipleExpectations:
  Exclude:
    - "spec/**/*"

Naming/FileName:
  Exclude:
    - "lib/jekyll-compress-flow.rb"
    - "jekyll-compress-flow.gemspec"
