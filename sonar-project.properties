# SonarQube Cloud configuration (CI-based analysis via GitHub Actions).
sonar.organization=gundestrup
sonar.projectKey=gundestrup_jekyll-compress-flow
sonar.projectName=jekyll-compress-flow

sonar.sources=.
sonar.test.inclusions=spec/**
sonar.exclusions=coverage/**,vendor/**

# Spec files exercise the same compressor table repeatedly by design;
# exclude them from copy/paste duplication detection.
sonar.cpd.exclusions=spec/**

# SimpleCov JSON report emitted by spec_helper.rb in CI
sonar.ruby.coverage.reportPaths=coverage/coverage.json
